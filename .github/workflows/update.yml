name: Update Singapore Hong Kong Capital Migration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: singapore-hong-kong-capital-migration
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout private engine
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run migration engine
        run: npm run update

      - name: Check generated output
        run: |
          test -f output/latest.json
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('output/latest.json', 'utf8'));

            if (!data || typeof data !== 'object') {
              throw new Error('latest.json is not a valid object');
            }

            console.log('Migration output validated.');
          "

      - name: Commit updated data
        run: |
          if git diff --quiet -- output/latest.json; then
            echo "No data changes."
            exit 0
          fi

          git config user.name "bondstats-bot"
          git config user.email "actions@users.noreply.github.com"

          git add output/latest.json
          git commit -m "Update Singapore-Hong Kong capital migration data"
          git push
